name: deepseek-search
version: 0.1.0
description: >-
  DeepSeek web search + page fetch backend (api.deepseek.com /v1/tools/search
  and /v1/tools/fetch). Backs Hermes web_search and web_extract; requires
  DEEPSEEK_API_KEY.
author: jameshu
license: Apache-2.0
homepage: https://github.com/statsmind/hermes-deepseek-search
kind: backend
requires_hermes: ">=0.22.0"
provides_web_providers:
  - deepseek
requires_env:
  - DEEPSEEK_API_KEY
